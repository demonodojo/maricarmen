<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>Maricarmen: La Defensa del Portal</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; }
  #screen { position: relative; }
  canvas { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #gl { visibility: hidden; image-rendering: auto; }

  button { font-family: monospace; font-weight: bold; color: #fff; cursor: pointer;
           background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.45);
           touch-action: none; -webkit-tap-highlight-color: transparent; }
  button.on { background: rgba(255,210,63,0.55); border-color: #ffd23f; }

  #top { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
         display: flex; gap: 8px; z-index: 2; }
  #top button { width: 40px; height: 40px; border-radius: 8px; font-size: 16px; padding: 0; opacity: 0.75; }
  #top .touch-only { display: none; }
  body.touch #top .touch-only { display: block; }

  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 1; }
  body.touch #touch { display: block; }
  #dpad { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
          width: 156px; height: 156px; pointer-events: auto; }
  #dpad button { position: absolute; width: 52px; height: 52px; border-radius: 10px; font-size: 20px; padding: 0; }
  #dpad .up { left: 52px; top: 0; }
  #dpad .left { left: 0; top: 52px; }
  #dpad .right { left: 104px; top: 52px; }
  #dpad .down { left: 52px; top: 104px; }
  #actions { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
             width: 204px; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 8px; pointer-events: auto; }
  #actions button { width: 62px; height: 62px; border-radius: 50%; font-size: 10px; padding: 0; line-height: 1.15; }
  #actions .hi { border-color: rgba(255,120,120,0.8); }
  #actions .mid { border-color: rgba(159,211,255,0.8); }
  #actions .lo { border-color: rgba(255,225,77,0.8); }
  #actions .sup { border-color: rgba(255,140,60,0.8); color: #ffb070; }
  #actions .sup.ready { background: rgba(255,80,40,0.55); border-color: #ffd23f; color: #fff; }
</style>
</head>
<body>
<div id="screen">
  <canvas id="gl" width="480" height="270"></canvas>
  <canvas id="game" width="320" height="180"></canvas>
</div>

<div id="top">
  <button id="btn-music" class="touch-only" aria-label="Música">&#9835;</button>
  <button id="btn-pause" class="touch-only" aria-label="Pausa">II</button>
  <button id="btn-fs" aria-label="Pantalla completa">&#x26F6;</button>
</div>

<div id="touch">
  <div id="dpad">
    <button data-key="ArrowUp" class="up" aria-label="Saltar">&#9650;</button>
    <button data-key="ArrowLeft" class="left" aria-label="Izquierda">&#9664;</button>
    <button data-key="ArrowRight" class="right" aria-label="Derecha">&#9654;</button>
    <button data-key="ArrowDown" class="down" aria-label="Agacharse">&#9660;</button>
  </div>
  <div id="actions">
    <button data-key="KeyZ" class="mid">PUÑO</button>
    <button data-key="KeyC" class="mid">RODI<br>LLA</button>
    <button data-key="KeyS" class="lo">PATADA<br>BAJA</button>
    <button data-key="KeyX" class="hi">CODO</button>
    <button data-key="KeyA" class="hi">PATADA<br>ALTA</button>
    <button data-key="KeyD" class="sup">GRITO</button>
  </div>
</div>

<script src="game.js?v=7"></script>
<script data-goatcounter="https://demonodojo.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
